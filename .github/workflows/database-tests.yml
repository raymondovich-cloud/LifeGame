name: LifeGame Database Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Application tests
        run: node --test source/application/identity/registration.test.mjs source/application/identity/login.test.mjs source/application/profile/profile.test.mjs source/application/finance/finance.test.mjs source/application/finance/finance.lifecycle.test.mjs source/application/finance/assets.analytics.test.mjs source/memory/finance/finance.memory.test.mjs

      - name: Run Identity and Profile infrastructure tests
        run: node --test source/infrastructure/identity/supabase.identity.mapper.test.mjs source/infrastructure/identity/supabase.identity.adapter.test.mjs source/infrastructure/supabase/profile.adapter.test.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install Supabase JavaScript client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.117.1

      - name: Inspect Supabase CLI env output
        shell: bash
        run: |
          set -euo pipefail
          env_output="$(supabase status -o env)"
          printf '%s\\n' "$env_output" | sed -E 's/((export )?(PUBLISHABLE_KEY|SECRET_KEY|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET|ACCESS_TOKEN|REFRESH_TOKEN|PASSWORD))=.*/\\1=[REDACTED]/'
          eval "$env_output"
          printf 'After eval: API_URL=%s\\n' "${API_URL:+set}"
          printf 'After eval: PUBLISHABLE_KEY=%s\\n' "${PUBLISHABLE_KEY:+set}"
          printf 'After eval: SUPABASE_URL=%s\\n' "${SUPABASE_URL:+set}"
          printf 'After eval: SUPABASE_PUBLISHABLE_KEY=%s\\n' "${SUPABASE_PUBLISHABLE_KEY:+set}"

      - name: Run real Finance persistence test
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env)"
          node --test source/infrastructure/supabase/finance.memory.supabase.integration.test.mjs

      - name: Run database tests
        run: supabase test db
