# .github/workflows/database-tests.yml — Version 1.1

name: LifeGame Database Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Web bootstrap syntax
        run: |
          node --check platforms/web/web.js
          node --check platforms/web/web.runtime.js
          node --check platforms/web/composition/root.js

      - name: Run Application and Finance domain tests
        run: node --test source/application/identity/registration.test.mjs source/application/identity/login.test.mjs source/application/profile/profile.test.mjs source/application/finance/finance.test.mjs source/application/finance/finance.lifecycle.test.mjs source/application/finance/assets.analytics.test.mjs source/application/finance/finance.analytics.test.mjs source/memory/finance/finance.memory.test.mjs source/domain/finance/financial.burden/financial.burden.test.mjs source/index/interaction/interaction.engine.test.mjs

      - name: Run Identity and Profile infrastructure tests
        run: node --test source/infrastructure/identity/supabase.identity.mapper.test.mjs source/infrastructure/identity/supabase.identity.adapter.test.mjs source/infrastructure/supabase/profile.adapter.test.mjs

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase
        run: supabase start

      - name: Install Supabase JavaScript client
        run: npm install --no-save --no-package-lock @supabase/supabase-js@2.117.1

      - name: Export Supabase CLI env
        shell: bash
        run: |
          set -euo pipefail
          env_output="$(supabase status -o env)"
          eval "$env_output"
          test -n "${API_URL:-}"
          test -n "${PUBLISHABLE_KEY:-}"
          {
            printf 'API_URL=%s\n' "$API_URL"
            printf 'PUBLISHABLE_KEY=%s\n' "$PUBLISHABLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Run real Finance persistence test
        shell: bash
        run: |
          set -euo pipefail
          printf 'Supabase test environment: API_URL=set, PUBLISHABLE_KEY=set\n'
          node --test source/infrastructure/supabase/finance.memory.supabase.integration.test.mjs

      - name: Reset local database before database tests
        run: supabase db reset

      - name: Run database tests
        run: supabase test db
