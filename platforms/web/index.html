<!-- platforms/web/index.html — Version 1.7 -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
        name="description"
        content="LifeGame — a premium personal system for managing life."
    >
    <meta name="theme-color" content="#070707">
    <meta name="color-scheme" content="dark">

    <title>LifeGame</title>

    <link rel="stylesheet" href="../../source/design/design.css">
</head>

<body>
    <main id="app" aria-label="LifeGame application">
        <section
            id="auth-root"
            class="module-content"
            aria-live="polite"
            hidden
        ></section>

        <section id="application-shell" class="app-shell" data-module="development">
            <header class="app-header">
                <div class="brand">
                    <span class="brand-name">LIFE GAME</span>
                </div>

                <div class="system-status" aria-label="System status">
                    <span class="status-dot" aria-hidden="true"></span>
                    <span>SYSTEM ONLINE</span>
                </div>
            </header>

            <section class="module-intro" aria-labelledby="module-title">
                <div class="module-meta">
                    <span class="module-label">LIFE MODULE 03</span>
                </div>
            </section>

            <section class="module-indicator" aria-label="Current module">
                <span class="module-number">03</span>
                <span class="module-word">MODULE</span>
            </section>

            <section id="module-content" class="module-content" aria-live="polite"></section>

            <nav class="app-navigation" aria-label="LifeGame modules">
                <a class="navigation-item" data-module="finance" href="#finance">
                    <span class="navigation-index">01</span>
                    <span class="navigation-label">Finance</span>
                </a>

                <a class="navigation-item" data-module="health" href="#health">
                    <span class="navigation-index">02</span>
                    <span class="navigation-label">Health</span>
                </a>

                <a
                    class="navigation-item is-active"
                    data-module="development"
                    href="#development"
                    aria-current="page"
                >
                    <span class="navigation-index">03</span>
                    <span class="navigation-label">Development</span>
                </a>

                <a class="navigation-item" data-module="profile" href="#profile">
                    <span class="navigation-index">04</span>
                    <span class="navigation-label">Profile</span>
                </a>
            </nav>

            <footer class="app-footer">
                <a
                    class="app-footer-link"
                    href="https://t.me/BillionsMone"
                    target="_blank"
                    rel="noopener noreferrer"
                >
                    Developed by Raymondovich
                </a>
            </footer>
        </section>
    </main>

    <noscript>
        <div class="noscript-message">
            LifeGame requires JavaScript to run.
        </div>
    </noscript>

    <script type="module" src="./web.js"></script>
</body>
</html>
